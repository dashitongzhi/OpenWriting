name: PR Merge Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-merge-checks-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke checks (macOS)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check PR diff whitespace
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Show Xcode toolchain
        run: |
          test "$MACOSX_DEPLOYMENT_TARGET" = "14.0"
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install smoke-check dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          missing_formulae=()
          command -v rg >/dev/null 2>&1 || missing_formulae+=(ripgrep)
          command -v actionlint >/dev/null 2>&1 || missing_formulae+=(actionlint)
          if (( ${#missing_formulae[@]} > 0 )); then
            brew install "${missing_formulae[@]}"
          fi

      - name: Validate workflow and script syntax
        run: |
          actionlint .github/workflows/*.yml
          for script in scripts/*.sh; do
            /bin/zsh -n "$script"
          done
          plutil -lint OpenWriting.xcodeproj/project.pbxproj

      - name: Run Codex PR review checks
        if: ${{ github.event_name == 'pull_request' }}
        run: zsh -f ./scripts/run-codex-pr-review-checks.sh

      - name: Verify architecture indexes and test target membership
        run: |
          zsh -f ./scripts/check-index-coverage.sh
          zsh -f ./scripts/verify-xctest-membership.sh

      - name: Run smoke checks
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/OpenWritingDerivedData-${{ github.run_id }}-${{ github.run_attempt }}
        run: zsh -f ./scripts/run-smoke-checks.sh

      - name: Run unsigned Release build
        env:
          CONFIGURATION: Release
          DERIVED_DATA_PATH: ${{ runner.temp }}/OpenWritingReleaseDerivedData-${{ github.run_id }}-${{ github.run_attempt }}
        run: zsh -f ./scripts/build-debug.sh

      - name: Run hosted XCTest launch guard
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/OpenWritingHostedXCTestGuardDerivedData-${{ github.run_id }}-${{ github.run_attempt }}
        run: zsh -f ./scripts/run-hosted-xctest-guard.sh

      - name: Run OpenWriting XCTest suite
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/OpenWritingTestsDerivedData-${{ github.run_id }}-${{ github.run_attempt }}
        run: zsh -f ./scripts/run-tests.sh
